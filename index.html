<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>化妆品与药品临期管家</title>
  <style>
    :root {
      --bg: #F4F4F6;
      --surface: #FFFFFF;
      --surface-subtle: #F9FAFB;
      --text-main: #0F172A;
      --text-secondary: #475569;
      --text-tertiary: #94A3B8;
      --border-subtle: #E2E8F0;
      --border-strong: #CBD5E1;
      --primary: #0F172A;
      --accent: #E11D48;
      --accent-soft: #FFE4E6;
      --danger: #EF4444;
      --danger-bg: #FEE2E2;
      --warning: #D97706;
      --warning-bg: #FEF3C7;
      --success: #059669;
      --success-bg: #D1FAE5;
      --purple: #8B5CF6;
      --purple-bg: #EDE9FE;
      --blue: #0284C7;
      --blue-bg: #E0F2FE;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-full: 9999px;
      --shadow-sm: 0 1px 2px 0 rgba(15, 23, 42, 0.05);
      --shadow-card: 0 4px 6px -1px rgba(15, 23, 42, 0.04), 0 2px 4px -2px rgba(15, 23, 42, 0.03);
      --shadow-card-hover: 0 12px 20px -3px rgba(15, 23, 42, 0.08), 0 4px 6px -4px rgba(15, 23, 42, 0.04);
      --shadow-popover: 0 16px 36px -4px rgba(15, 23, 42, 0.16), 0 6px 14px rgba(15, 23, 42, 0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg);
      color: var(--text-main);
      padding-bottom: 120px;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border-subtle);
      padding: 10px 14px 10px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .app-title-group {
      display: flex;
      align-items: center;
      gap: 8px;
      position: relative;
    }

    .btn-menu-trigger {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-md);
      background: var(--surface);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: all 0.15s ease;
      flex-shrink: 0;
    }

    .btn-menu-trigger:active {
      transform: scale(0.94);
      background: #E2E8F0;
    }

    .app-title-group h1 {
      font-size: 19px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text-main);
    }

    .badge-sync {
      font-size: 11px;
      padding: 2px 7px;
      border-radius: var(--radius-full);
      background: #E2E8F0;
      color: var(--text-secondary);
      font-weight: 600;
    }

    .badge-sync.online {
      background: var(--success-bg);
      color: var(--success);
    }

    .btn-batch-toggle {
      background: var(--surface);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: var(--radius-full);
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: all 0.15s ease;
    }

    .btn-batch-toggle.active {
      background: var(--primary);
      color: #FFF;
      border-color: var(--primary);
    }

    .menu-popover {
      position: absolute;
      top: 44px;
      left: 0;
      width: 240px;
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-popover);
      padding: 6px;
      z-index: 100;
      display: none;
      flex-direction: column;
      gap: 2px;
      animation: popoverFadeIn 0.18s cubic-bezier(0.16, 1, 0.3, 1);
      transform-origin: top left;
    }

    @keyframes popoverFadeIn {
      from { opacity: 0; transform: scale(0.95) translateY(-6px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .menu-popover.show {
      display: flex;
    }

    .popover-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
      background: transparent;
      border: none;
      cursor: pointer;
      text-align: left;
      transition: background 0.12s ease;
      width: 100%;
    }

    .popover-item:hover, .popover-item:active {
      background: var(--surface-subtle);
    }

    .popover-item.danger {
      color: var(--danger);
    }

    .popover-item.danger:hover, .popover-item.danger:active {
      background: var(--danger-bg);
    }

    .popover-divider {
      height: 1px;
      background: var(--border-subtle);
      margin: 4px 6px;
    }

    .popover-backdrop {
      position: fixed;
      inset: 0;
      z-index: 95;
      background: transparent;
      display: none;
    }

    .popover-backdrop.show {
      display: block;
    }

    .controls-row {
      display: flex;
      gap: 6px;
      align-items: center;
      margin-bottom: 8px;
    }

    .search-input-wrap {
      flex: 1;
      position: relative;
    }

    .search-input-wrap input {
      width: 100%;
      height: 36px;
      padding: 0 10px 0 32px;
      background: #E8ECEF;
      border: none;
      border-radius: var(--radius-md);
      font-size: 13px;
      color: var(--text-main);
      outline: none;
    }

    .search-input-wrap .search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 13px;
      color: var(--text-tertiary);
    }

    .btn-tool {
      height: 36px;
      padding: 0 10px;
      background: var(--surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .btn-tool:active {
      transform: scale(0.96);
    }

    .btn-tool.active-tool {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-soft);
    }

    .category-pills-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }
    .category-pills-bar::-webkit-scrollbar { display: none; }

    .cat-pill {
      flex-shrink: 0;
      height: 28px;
      padding: 0 10px;
      border-radius: var(--radius-full);
      background: var(--surface);
      border: 1px solid var(--border-subtle);
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: all 0.15s ease;
    }

    .cat-pill.active {
      background: var(--primary);
      color: #FFF;
      border-color: var(--primary);
    }

    .pill-count {
      font-size: 10px;
      padding: 1px 5px;
      border-radius: var(--radius-full);
      background: #E2E8F0;
      color: var(--text-secondary);
      font-family: ui-monospace, Menlo, monospace;
    }

    .cat-pill.active .pill-count {
      background: rgba(255, 255, 255, 0.25);
      color: #FFF;
    }

    .status-segmented-bar {
      display: flex;
      background: #EAEBED;
      padding: 3px;
      border-radius: var(--radius-md);
      gap: 3px;
      margin-top: 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .status-segmented-bar::-webkit-scrollbar { display: none; }

    .segment-tab {
      flex: 1;
      min-width: 60px;
      height: 32px;
      border-radius: calc(var(--radius-md) - 2px);
      border: none;
      background: transparent;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      transition: all 0.16s ease;
      white-space: nowrap;
    }

    .segment-tab.active {
      background: var(--surface);
      color: var(--text-main);
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.08);
    }

    .segment-badge {
      font-size: 10px;
      padding: 1px 5px;
      border-radius: var(--radius-full);
      background: rgba(15, 23, 42, 0.06);
      color: var(--text-secondary);
      font-family: ui-monospace, Menlo, monospace;
    }

    .segment-tab.active .segment-badge {
      background: #E2E8F0;
      color: var(--text-main);
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 12px 14px;
    }

    .tab-page {
      display: none;
    }

    .tab-page.active {
      display: block;
    }

    .list-mode {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .item-card {
      background: var(--surface);
      border-radius: var(--radius-lg);
      border: 1px solid rgba(226, 232, 240, 0.9);
      box-shadow: var(--shadow-card);
      position: relative;
      cursor: pointer;
      transition: transform 0.16s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.16s ease, border-color 0.16s ease;
      user-select: none;
    }

    .item-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-card-hover);
    }

    .item-card.press-active {
      transform: scale(0.985);
    }

    .item-card.selected {
      border-color: var(--accent);
      background: #FFFBFB;
    }

    .list-mode .item-card {
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .card-thumb {
      width: 64px;
      height: 64px;
      border-radius: var(--radius-md);
      background: var(--surface-subtle);
      border: 1px solid var(--border-subtle);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .card-thumb img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .card-thumb .fallback-icon {
      font-size: 28px;
    }

    .card-content {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .card-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-main);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .badge-tags-row {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
    }

    .tag-badge {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .tag-cat { background: #F1F5F9; color: #475569; }
    .tag-status-inuse { background: var(--blue-bg); color: var(--blue); }
    .tag-status-unopened { background: #F1F5F9; color: var(--text-tertiary); }
    .tag-status-repurchase { background: #FCE7F3; color: #DB2777; }
    .tag-status-dislike { background: #F3F4F6; color: #6B7280; }
    .tag-added {
      background: #F8FAFC;
      color: #0F172A;
      font-size: 11px;
      font-weight: 700;
      border: 1px solid #CBD5E1;
      padding: 2px 7px;
    }
    .tag-custom { background: #FAF5FF; color: var(--purple); border: 1px solid #F3E8FF; }
    .tag-location { background: #FEF3C7; color: #B45309; }
    .tag-estimate { background: #ECFDF5; color: #047857; font-size: 10px; }

    .card-meta-text {
      font-size: 11px;
      color: var(--text-tertiary);
    }

    .card-right-status {
      text-align: right;
      min-width: 70px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: center;
    }

    .countdown-number {
      font-size: 19px;
      font-weight: 800;
      font-family: ui-monospace, Menlo, monospace;
      line-height: 1;
    }

    .status-capsule {
      font-size: 10px;
      font-weight: 700;
      margin-top: 4px;
      padding: 2px 6px;
      border-radius: var(--radius-full);
    }

    .btn-quick-open {
      margin-top: 6px;
      background: #E0F2FE;
      color: #0284C7;
      border: 1px solid #BAE6FD;
      border-radius: var(--radius-full);
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      cursor: pointer;
    }

    .grid-mode {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px;
    }

    .grid-mode .item-card {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .grid-mode .card-thumb {
      width: 100%;
      height: 120px;
      border-radius: 0;
      border: none;
      border-bottom: 1px solid var(--border-subtle);
    }

    .grid-mode .card-content {
      padding: 10px;
      gap: 6px;
    }

    .grid-mode .card-title {
      font-size: 13px;
      white-space: normal;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .grid-mode .card-right-status {
      align-items: stretch;
      width: 100%;
      margin-top: 4px;
    }

    .grid-mode .status-capsule {
      text-align: center;
    }

    .state-good { color: var(--success); }
    .state-warning { color: var(--warning); }
    .state-danger { color: var(--danger); }
    .capsule-good { background: var(--success-bg); color: var(--success); }
    .capsule-warning { background: var(--warning-bg); color: var(--warning); }
    .capsule-danger { background: var(--danger-bg); color: var(--danger); }

    .select-checkbox {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid #CBD5E1;
      background: #FFF;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 5;
      font-size: 11px;
      font-weight: 800;
      color: transparent;
      box-shadow: var(--shadow-sm);
    }

    .batch-mode .select-checkbox {
      display: flex;
    }

    .item-card.selected .select-checkbox {
      background: var(--accent);
      border-color: var(--accent);
      color: #FFF;
    }

    .batch-panel {
      position: fixed;
      bottom: 74px;
      left: 14px;
      right: 14px;
      max-width: 772px;
      margin: 0 auto;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-popover);
      padding: 10px 14px;
      z-index: 60;
      display: none;
      flex-direction: column;
      gap: 8px;
      animation: popoverFadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .batch-panel.show {
      display: flex;
    }

    .batch-panel-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .batch-pill-btn {
      background: rgba(255, 255, 255, 0.15);
      border: none;
      padding: 6px 10px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 600;
      color: #FFF;
      cursor: pointer;
    }

    .batch-btn-danger {
      background: var(--danger);
      border: none;
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 700;
      color: #FFF;
      cursor: pointer;
    }

    .batch-cat-select {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: var(--radius-sm);
      padding: 6px 8px;
      color: #FFF;
      font-size: 12px;
      outline: none;
    }
    .batch-cat-select option {
      color: var(--text-main);
      background: #FFF;
    }

    .batch-btn-confirm {
      background: #FFF;
      color: var(--text-main);
      border: none;
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .calendar-card {
      background: var(--surface);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-subtle);
      box-shadow: var(--shadow-card);
      padding: 16px;
      margin-bottom: 16px;
    }

    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .calendar-title {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .cal-nav-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--surface-subtle);
      border: 1px solid var(--border-subtle);
      font-weight: 800;
      cursor: pointer;
    }

    .cal-grid-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-tertiary);
      margin-bottom: 8px;
    }

    .cal-grid-days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      text-align: center;
    }

    .cal-day-cell {
      height: 48px;
      border-radius: var(--radius-md);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-main);
      position: relative;
    }

    .cal-day-cell.other-month {
      color: #CBD5E1;
    }

    .cal-day-cell.selected {
      background: var(--primary) !important;
      color: #FFF !important;
    }

    .cal-day-cell.today:not(.selected) {
      background: #E2E8F0;
      color: var(--accent);
    }

    .cal-dots-row {
      display: flex;
      gap: 2px;
      margin-top: 2px;
      height: 5px;
    }

    .cal-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
    }

    .dot-expiry-good { background: var(--success); }
    .dot-expiry-warning { background: var(--warning); }
    .dot-expiry-danger { background: var(--danger); }
    .dot-opened { background: var(--purple); }
    .dot-added { background: var(--blue); }

    .bottom-tabbar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-around;
      z-index: 50;
      padding: 0 10px;
    }

    .tab-btn {
      flex: 1;
      height: 100%;
      background: transparent;
      border: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      cursor: pointer;
      color: var(--text-tertiary);
    }

    .tab-btn.active {
      color: var(--text-main);
    }

    .tab-icon {
      font-size: 20px;
      line-height: 1;
    }

    .tab-title {
      font-size: 10px;
      font-weight: 700;
    }

    .fab-cat-container {
      position: fixed;
      bottom: 74px;
      right: 18px;
      z-index: 55;
      display: flex;
      flex-direction: column;
      align-items: center;
      user-select: none;
      -webkit-user-select: none;
    }

    .fab-cat-circle {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: linear-gradient(135deg, #8B5CF6, #EC4899);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      box-shadow: 0 8px 20px rgba(139, 92, 246, 0.38);
      border: 3px solid #FFF;
      cursor: pointer;
      transition: transform 0.15s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.15s ease;
    }

    .fab-cat-circle:active, .fab-cat-circle.pressing {
      transform: scale(0.92);
      box-shadow: 0 4px 10px rgba(139, 92, 246, 0.3);
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 120;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-sheet {
      background: #FFF;
      width: 100%;
      max-width: 500px;
      border-radius: 24px 24px 0 0;

  <!-- Main Application Logic -->
  <script>
    const STORAGE_KEY = "cosmetics_data_pro_v3";
    const CAT_KEY = "cosmetics_cats_pro_v3";
    const SORT_KEY = "cosmetics_sort_pro_v3";
    const LAYOUT_KEY = "cosmetics_layout_pro_v3";
    const TOKEN_KEY = "github_token_pro_v3";

    const REPO_OWNER = "q9656";
    const REPO_NAME = "q";
    const FILE_PATH = "data.json";

    const DEFAULT_CATEGORIES = ["唇", "口", "精", "霜", "乳", "水", "眼", "妆", "体", "药", "其"];

    // 排序循环列表：点击直接切换，不使用下拉菜单
    const SORT_CYCLE_LIST = [
      { key: "added_desc", label: "🕒 添加时间 ↓" },
      { key: "expiry_asc", label: "⏰ 到期时间 ↑" },
      { key: "name_asc", label: "🔤 品名 A-Z" }
    ];

    let currentFileSha = null;
    let currentCategory = "全部";
    let currentLifeStatus = "全部";
    let currentSort = localStorage.getItem(SORT_KEY) || "added_desc";
    let currentLayout = localStorage.getItem(LAYOUT_KEY) || "list";

    let filterExpiryStatus = "全部";
    let filterOpenStatus = "全部";

    let isBatchMode = false;
    let selectedIds = new Set();
    let longPressTimer = null;
    let pressStartX = 0;
    let pressStartY = 0;

    let calViewDate = new Date();
    let calSelectedDateStr = new Date().toISOString().slice(0, 10);

    /* Storage Helpers */
    function getCategories() {
      const s = localStorage.getItem(CAT_KEY);
      if (!s) return [...DEFAULT_CATEGORIES];
      try {
        const arr = JSON.parse(s);
        return Array.isArray(arr) && arr.length > 0 ? arr : [...DEFAULT_CATEGORIES];
      } catch (e) {
        return [...DEFAULT_CATEGORIES];
      }
    }

    function saveCategories(cats) {
      localStorage.setItem(CAT_KEY, JSON.stringify(cats));
      renderCategoryPills();
      updateCategorySelects();
    }

    function getItems() {
      const s = localStorage.getItem(STORAGE_KEY);
      if (!s) return [];
      try {
        const arr = JSON.parse(s);
        return Array.isArray(arr) ? arr : [];
      } catch (e) {
        return [];
      }
    }

    function saveItems(items) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
      renderCategoryPills();
      updateLifecycleBadges();
      pushToRepo(items);
    }

    function calcDays(expiryDateStr) {
      if (!expiryDateStr) return 9999;
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const target = new Date(expiryDateStr);
      target.setHours(0, 0, 0, 0);
      return Math.round((target - today) / (1000 * 60 * 60 * 24));
    }

    function getItemTimestamp(item) {
      if (!item) return 0;
      if (item.createdAt) {
        const t = new Date(item.createdAt).getTime();
        if (!isNaN(t)) return t;
      }
      return 0;
    }

    /* Consumption Estimator */
    function estimateConsumptionDuration(item) {
      const volMatch = (item.volume || "").match(/(\d+(?:\.\d+)?)/);
      if (!volMatch) return null;
      const vol = parseFloat(volMatch[1]);
      if (isNaN(vol) || vol <= 0) return null;

      let dailyUsage = 0.5;
      const cat = item.category || "";
      if (cat === "精") dailyUsage = 0.6;
      else if (cat === "霜") dailyUsage = 0.8;
      else if (cat === "乳") dailyUsage = 1.0;
      else if (cat === "水") dailyUsage = 1.8;
      else if (cat === "眼") dailyUsage = 0.2;
      else if (cat === "妆") dailyUsage = 0.4;
      else if (cat === "体") dailyUsage = 4.0;
      else if (cat === "口" || cat === "唇") dailyUsage = 0.05;

      const days = Math.round(vol / dailyUsage);
      if (item.isSample) return `🧪 小样 约用 ${Math.min(days, 20)} 次`;
      if (days > 365) return `🧴 约用 ${(days / 30).toFixed(0)} 个月`;
      return `🧴 预计可用 ${days} 天`;
    }

    /* Sorting and Cycle Logic */
    function cycleNextSort() {
      const idx = SORT_CYCLE_LIST.findIndex(s => s.key === currentSort);
      const nextIdx = (idx + 1) % SORT_CYCLE_LIST.length;
      currentSort = SORT_CYCLE_LIST[nextIdx].key;
      localStorage.setItem(SORT_KEY, currentSort);
      updateSortButtonLabel();
      renderCards();
    }

    function updateSortButtonLabel() {
      const btnText = document.getElementById("sortBtnText");
      if (!btnText) return;
      const match = SORT_CYCLE_LIST.find(s => s.key === currentSort) || SORT_CYCLE_LIST[0];
      btnText.innerText = match.label;
    }

    /* Filter Engine */
    function getFilteredItems() {
      let items = getItems();
      const s = (document.getElementById("searchInput").value || "").trim().toLowerCase();

      // 1. 生命周期过滤
      if (currentLifeStatus !== "全部") {
        items = items.filter(it => {
          const st = it.status || (it.openedAt ? "使用中" : "未开封");
          return st === currentLifeStatus;
        });
      }

      // 2. 分类过滤
      if (currentCategory !== "全部") {
        items = items.filter(it => it.category === currentCategory);
      }

      // 3. 高级筛选弹窗条件
      if (filterExpiryStatus !== "全部") {
        items = items.filter(it => {
          const d = calcDays(it.expiry);
          if (filterExpiryStatus === "正常") return d > 30;
          if (filterExpiryStatus === "临期") return d >= 0 && d <= 30;
          if (filterExpiryStatus === "过期") return d < 0;
          return true;
        });
      }

      if (filterOpenStatus !== "全部") {
        items = items.filter(it => {
          const isOpened = Boolean(it.openedAt || it.status === "使用中");
          return filterOpenStatus === "已开封" ? isOpened : !isOpened;
        });
      }

      // 4. 关键字搜索 (品名、备注、标签、位置)
      if (s) {
        items = items.filter(it => {
          const name = (it.name || "").toLowerCase();
          const notes = (it.notes || "").toLowerCase();
          const tags = Array.isArray(it.tags) ? it.tags.join(" ").toLowerCase() : (it.tags || "").toLowerCase();
          const loc = (it.location || "").toLowerCase();
          return name.includes(s) || notes.includes(s) || tags.includes(s) || loc.includes(s);
        });
      }

      // 5. 排序引擎
      items.sort((a, b) => {
        if (currentSort === "added_desc") {
          return getItemTimestamp(b) - getItemTimestamp(a);
        }
        if (currentSort === "expiry_asc") {
          return new Date(a.expiry || "9999-12-31") - new Date(b.expiry || "9999-12-31");
        }
        if (currentSort === "name_asc") {
          return (a.name || "").localeCompare(b.name || "", "zh-Hans-CN", { sensitivity: "base" });
        }
        return 0;
      });

      return items;
    }

    /* Render Cards */
    function renderCards() {
      const container = document.getElementById("cardsContainer");
      const emptyState = document.getElementById("emptyState");
      if (!container) return;

      container.className = currentLayout === "grid" ? "grid-mode" : "list-mode";
      if (isBatchMode) container.classList.add("batch-mode");

      const items = getFilteredItems();
      if (items.length === 0) {
        container.innerHTML = "";
        if (emptyState) emptyState.style.display = "block";
        return;
      }

      if (emptyState) emptyState.style.display = "none";
      container.innerHTML = "";

      items.forEach(item => {
        const el = createCardElement(item);
        container.appendChild(el);
      });

      hydrateThumbs(items);
    }

    function createCardElement(item) {
      const card = document.createElement("div");
      card.className = "item-card" + (selectedIds.has(item.id) ? " selected" : "");
      card.setAttribute("data-id", item.id);

      const d = calcDays(item.expiry);
      let dayClass = "state-good";
      let capsuleClass = "capsule-good";
      let countdownText = `${d}天`;
      let statusDesc = "正常使用";

      if (d < 0) {
        dayClass = "state-danger";
        capsuleClass = "capsule-danger";
        countdownText = "过期";
        statusDesc = `已过期 ${Math.abs(d)} 天`;
      } else if (d <= 30) {
        dayClass = "state-warning";
        capsuleClass = "capsule-warning";
        statusDesc = d === 0 ? "今天到期" : "即将临期";
      }

      const lifeStatus = item.status || (item.openedAt ? "使用中" : "未开封");
      let lifeBadge = "";
      if (lifeStatus === "使用中") lifeBadge = `<span class="tag-badge tag-status-inuse">🧴 使用中</span>`;
      else if (lifeStatus === "未开封") lifeBadge = `<span class="tag-badge tag-status-unopened">📦 未开封</span>`;
      else if (lifeStatus === "会回购") lifeBadge = `<span class="tag-badge tag-status-repurchase">❤️ 会回购</span>`;
      else if (lifeStatus === "不好用") lifeBadge = `<span class="tag-badge tag-status-dislike">👎 不好用</span>`;
      else if (lifeStatus === "已废弃") lifeBadge = `<span class="tag-badge" style="background:#FEE2E2; color:#991B1B;">🗑️ 已废弃</span>`;

      const addedDateStr = item.createdAt ? item.createdAt.slice(0, 10) : "";
      const addedTag = addedDateStr ? `<span class="tag-badge tag-added">🕒 入库 ${addedDateStr}</span>` : "";

      let tagsBadges = "";
      if (item.tags) {
        const tagArr = Array.isArray(item.tags) ? item.tags : item.tags.split(/[,，\s]+/);
        tagsBadges = tagArr.filter(Boolean).map(t => `<span class="tag-badge tag-custom">#${t}</span>`).join("");
      }

      const locBadge = item.location ? `<span class="tag-badge tag-location">📍 ${item.location}</span>` : "";
      const estimateText = estimateConsumptionDuration(item);
      const estimateBadge = estimateText ? `<span class="tag-badge tag-estimate">${estimateText}</span>` : "";

      const quickOpenBtn = (lifeStatus === "未开封") ?
        `<button class="btn-quick-open" onclick="quickOpenItem(event, '${item.id}')">⚡ 拆封</button>` : "";

      card.innerHTML = `
        <div class="select-checkbox">✓</div>
        <div class="card-thumb" data-thumb-id="${item.id}"></div>
        <div class="card-content">
          <div class="card-title">${item.name || "未命名物品"}</div>
          <div class="badge-tags-row">
            <span class="tag-badge tag-cat">${item.category || "其"}</span>
            ${lifeBadge}
            ${addedTag}
            ${locBadge}
            ${tagsBadges}
            ${estimateBadge}
          </div>
          <div class="card-meta-text">到期: ${item.expiry || "未设置"} ${item.openedAt ? "· 开封: " + item.openedAt : ""}</div>
        </div>
        <div class="card-right-status">
          <div class="countdown-number ${dayClass}">${countdownText}</div>
          <div class="status-capsule ${capsuleClass}">${statusDesc}</div>
          ${quickOpenBtn}
        </div>
      `;

      card.onclick = (e) => {
        if (isBatchMode) {
          toggleSelect(item.id);
        } else {
          openModal(item);
        }
      };

      attachLongPress(card, item.id);
      return card;
    }

    function quickOpenItem(e, id) {
      e.stopPropagation();
      let items = getItems();
      const today = new Date().toISOString().slice(0, 10);
      items = items.map(it => {

          return { ...it, status: "使用中", openedAt: today };
        }

      renderCalendar();

    function handlePhotoUpload(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (evt) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement("canvas");
          const maxDim = 480;
          let w = img.width;
          let h = img.height;
          if (w > h && w > maxDim) {
            h = Math.round((h * maxDim) / w);
            w = maxDim;
          } else if (h > maxDim) {
            w = Math.round((w * maxDim) / h);
            h = maxDim;
          }
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, w, h);
          const compressedB64 = canvas.toDataURL("image/jpeg", 0.75);

          document.getElementById("itemImage").value = compressedB64;
          document.getElementById("photoPreviewImg").src = compressedB64;
          document.getElementById("photoPlaceholder").style.display = "none";
          document.getElementById("photoPreviewContainer").style.display = "block";
        };
        img.src = evt.target.result;
      };
      reader.readAsDataURL(file);
      e.target.value = "";
    }

    function saveItem(e) {
      e.preventDefault();
      const id = document.getElementById("itemId").value || "item_" + Date.now();
      const rawTags = document.getElementById("itemTags").value.trim();
      const tags = rawTags ? rawTags.split(/[,，\s]+/).filter(Boolean) : [];

      const item = {
        id: id,
        name: document.getElementById("itemName").value.trim(),
        category: document.getElementById("itemCategory").value,
        status: document.getElementById("itemStatus").value,
        expiry: document.getElementById("itemExpiry").value,
        openedAt: document.getElementById("itemOpened").value || null,
        createdAt: document.getElementById("itemAdded").value || new Date().toISOString().slice(0, 10),
        pao: document.getElementById("itemPao").value ? parseInt(document.getElementById("itemPao").value, 10) : null,
        volume: document.getElementById("itemVolume").value.trim() || null,
        isSample: document.getElementById("itemIsSample").value === "1",
        tags: tags,
        location: document.getElementById("itemLocation").value.trim() || null,
        notes: document.getElementById("itemNotes").value.trim() || null,
        image: document.getElementById("itemImage").value || null
      };

      let items = getItems();

        saveItems(items);
        closeModal();
        renderCards();
        renderCalendar();

    /* AI / JSON Import */
    function openAISync() {
      document.getElementById("aiInput").value = "";
      document.getElementById("aiModal").style.display = "flex";
    }

    function closeAISync() {
      document.getElementById("aiModal").style.display = "none";
    }

    function pasteClip() {
      document.getElementById("aiInput").focus();
      document.execCommand('paste');
    }

    function applyAI() {
      const text = document.getElementById("aiInput").value.trim();
      if (!text) return;

      try {
        let clean = text;
        const match = text.match(/```(?:json)?([\s\S]*?)```/);
        if (match) clean = match[1].trim();
        const parsed = JSON.parse(clean);
        const list = Array.isArray(parsed) ? parsed : [parsed];

        let items = getItems();
        list.forEach(p => {
          items.unshift({
            id: "item_" + Date.now() + "_" + Math.random().toString(36).substr(2, 4),
            name: p.name || p.品名 || "AI导入物品",
            category: p.category || p.单字分类 || p.分类 || "其",
            status: p.status || p.生命周期 || "未开封",
            expiry: p.expiry || p.到期日期 || "",
            openedAt: p.openedAt || p.开封日期 || null,
            createdAt: p.createdAt || new Date().toISOString().slice(0, 10),
            pao: p.pao || null,
            volume: p.volume || p.容量 || null,
            isSample: Boolean(p.isSample || p.是否小样),
            tags: Array.isArray(p.tags) ? p.tags : (p.功效标签 ? [p.功效标签] : []),
            location: p.location || p.存放位置 || null,
            notes: p.notes || p.备注 || null,
            image: p.image || null
          });
        });

        saveItems(items);
        closeAISync();
        renderCards();
        renderCalendar();
      } catch (err) {
        alert("JSON 格式解析失败，请检查数据");
      }
    }

    /* Single Floating Cat FAB Gestures: Tap for AI, Long-press for Add */
    function setupFabGestures() {
      const fab = document.getElementById("fabCatBtn");
      if (!fab) return;

      let timer = null;
      let isLongPressed = false;

      const triggerLongPress = () => {
        isLongPressed = true;
        fab.classList.remove("pressing");
        if (navigator.vibrate) navigator.vibrate(50);
        openModal();
      };

      fab.addEventListener("touchstart", (e) => {
        isLongPressed = false;
        fab.classList.add("pressing");
        timer = setTimeout(triggerLongPress, 450);
      }, { passive: true });

      fab.addEventListener("touchend", (e) => {
        clearTimeout(timer);
        fab.classList.remove("pressing");
        if (!isLongPressed) {
          openAISync();
        }
      });

      fab.addEventListener("touchcancel", () => {
        clearTimeout(timer);
        fab.classList.remove("pressing");
      });

      fab.addEventListener("mousedown", (e) => {
        isLongPressed = false;
        fab.classList.add("pressing");
        timer = setTimeout(triggerLongPress, 450);
      });

      fab.addEventListener("mouseup", (e) => {
        clearTimeout(timer);
        fab.classList.remove("pressing");
        if (!isLongPressed) {
          openAISync();
        }
      });

      fab.addEventListener("mouseleave", () => {
        clearTimeout(timer);
        fab.classList.remove("pressing");
      });
    }

    /* Long-press for Batch Selection on Cards */
    function attachLongPress(el, id) {
      el.addEventListener('touchstart', (e) => {
        pressStartX = e.touches[0].clientX;
        pressStartY = e.touches[0].clientY;
        el.classList.add("press-active");
        longPressTimer = setTimeout(() => {
          if (!isBatchMode) toggleBatchMode();
          toggleSelect(id);
          if (navigator.vibrate) navigator.vibrate(40);
        }, 500);
      }, { passive: true });

      el.addEventListener('touchmove', (e) => {
        const dx = Math.abs(e.touches[0].clientX - pressStartX);
        const dy = Math.abs(e.touches[0].clientY - pressStartY);
        if (dx > 8 || dy > 8) {
          clearTimeout(longPressTimer);
          el.classList.remove("press-active");
        }
      }, { passive: true });

      el.addEventListener('touchend', () => {
        clearTimeout(longPressTimer);
        el.classList.remove("press-active");
      });

      el.addEventListener('touchcancel', () => {
        clearTimeout(longPressTimer);
        el.classList.remove("press-active");
      });
    }

    /* Batch Actions */
    function toggleBatchMode() {
      isBatchMode = !isBatchMode;
      selectedIds.clear();
      const btn = document.getElementById("btnBatchToggle");
      const panel = document.getElementById("batchPanel");
      const container = document.getElementById("cardsContainer");

      if (isBatchMode) {
        btn.innerText = "完成";
        btn.classList.add("active");
        panel.classList.add("show");
        container.classList.add("batch-mode");
      } else {
        btn.innerText = "批量";
        btn.classList.remove("active");
        panel.classList.remove("show");
        container.classList.remove("batch-mode");
      }
      updateBatchCount();
      renderCards();
    }

    function toggleSelect(id) {
      if (selectedIds.has(id)) selectedIds.delete(id);
      else selectedIds.add(id);
      updateBatchCount();
      renderCards();
    }

    function selectAll() {
      getFilteredItems().forEach(i => selectedIds.add(i.id));
      updateBatchCount();
      renderCards();
    }

    function deselectAll() {
      selectedIds.clear();
      updateBatchCount();
      renderCards();
    }

      if (selectedIds.size === 0) return;

      if (selectedIds.size === 0) return;

      selectedIds.clear();
      toggleBatchMode();
      renderCards();

    /* Hydrate Thumbnails */
    function hydrateThumbs(items) {
      document.querySelectorAll("[data-thumb-id]").forEach(el => {
        const id = el.getAttribute("data-thumb-id");
        const item = items.find(x => x.id === id);
        if (!item) return;

        if (item.image && item.image.trim()) {
          const img = document.createElement("img");
          img.src = item.image;
          img.onerror = () => { el.innerHTML = `<span class="fallback-icon">${item.category || "🧴"}</span>`; };
          el.innerHTML = "";
          el.appendChild(img);
        } else {
          el.innerHTML = `<span class="fallback-icon">${item.category || "🧴"}</span>`;
        }
      });
    }

        const a = document.createElement("a");
        a.href = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(getItems(), null, 2));
        a.download = `临期管家备份_${new Date().toISOString().slice(0, 10)}.json`;
        a.click();
      } else if (action === 'restore') {
        document.getElementById('importFile').click();
      } else if (action === 'clear') {
        if (confirm("确定要清空全部物品数据吗？此操作不可逆！")) {
          saveItems([]);
          renderCards();
          renderCalendar();
        }
      }
    }

    function importData(e) {
      const f = e.target.files[0];
      if (!f) return;
      const r = new FileReader();
      r.onload = evt => {
        try {
          const d = JSON.parse(evt.target.result);
          if (Array.isArray(d)) {
            saveItems(d);
            renderCards();
            renderCalendar();
          }
        } catch (err) {
          console.error("恢复数据解析失败", err);
        }
      };
      r.readAsText(f);
      e.target.value = "";
    }

    /* GitHub Cloud Sync (UTF-8 Native Support) */
    function updateSyncBadge(online) {
      const badge = document.getElementById("syncStatusBadge");
      if (!badge) return;
      if (online) {
        badge.innerText = "☁️ 仓库已连接";
        badge.className = "badge-sync online";
      } else {
        badge.innerText = "● 本地";
        badge.className = "badge-sync";
      }
    }

    async function pullFromRepo() {
      const token = localStorage.getItem(TOKEN_KEY);
      const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`;
      const headers = { "Accept": "application/vnd.github.v3+json" };
      if (token) headers["Authorization"] = `token ${token}`;

      try {
        const res = await fetch(url, { headers });
        if (res.ok) {
          const data = await res.json();
          currentFileSha = data.sha;
          const cleanB64 = data.content.replace(/\s/g, '');
          const binaryStr = atob(cleanB64);
          const bytes = new Uint8Array(binaryStr.length);
          for (let i = 0; i < binaryStr.length; i++) {
            bytes[i] = binaryStr.charCodeAt(i);
          }
          const content = new TextDecoder('utf-8').decode(bytes);
          const cloudItems = JSON.parse(content);
          if (Array.isArray(cloudItems) && cloudItems.length > 0) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(cloudItems));
            renderCategoryPills();
            renderCards();
            renderCalendar();
          }
          if (token) updateSyncBadge(true);
        } else {
          updateSyncBadge(false);
        }
      } catch (err) {
        console.warn("云端同步或拉取跳过:", err);
        updateSyncBadge(false);
      }
    }

    async function pushToRepo(items) {
      const token = localStorage.getItem(TOKEN_KEY);
      if (!token) return;

      const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`;
      const jsonStr = JSON.stringify(items, null, 2);
      const bytes = new TextEncoder().encode(jsonStr);
      let binaryStr = "";
      for (let i = 0; i < bytes.length; i++) {
        binaryStr += String.fromCharCode(bytes[i]);
      }
      const b64Content = btoa(binaryStr);

      try {
        const bodyData = { message: "update cosmetics data", content: b64Content };
        if (currentFileSha) bodyData.sha = currentFileSha;

        const res = await fetch(url, {
          method: "PUT",
          headers: {
            "Authorization": `token ${token}`,
            "Accept": "application/vnd.github.v3+json",
            "Content-Type": "application/json"
          },
          body: JSON.stringify(bodyData)
        });

        if (res.ok) {
          const resData = await res.json();
          currentFileSha = resData.content.sha;
          updateSyncBadge(true);
        }
      } catch (err) {
        console.error("推送仓库数据失败:", err);
      }
    }

    function openRepoConfigModal() {
      closeAllPopovers();
      document.getElementById("repoTokenInput").value = localStorage.getItem(TOKEN_KEY) || "";
      document.getElementById("repoModal").style.display = "flex";
    }

    function closeRepoConfigModal() {
      document.getElementById("repoModal").style.display = "none";
    }

    function saveRepoConfig() {
      const token = document.getElementById("repoTokenInput").value.trim();
      if (!token) {
        localStorage.removeItem(TOKEN_KEY);
        updateSyncBadge(false);
        closeRepoConfigModal();
        return;
      }
      localStorage.setItem(TOKEN_KEY, token);
      closeRepoConfigModal();
      pullFromRepo();
    }

    function triggerManualSync() {
      closeAllPopovers();
      pullFromRepo();
    }

    /* Category Management Sheet */
    function openCatManageSheet() {
      closeAllPopovers();
      renderCatManageList();
      document.getElementById("catManageModal").style.display = "flex";
    }

    function closeCatManageSheet() {
      document.getElementById("catManageModal").style.display = "none";
    }

    function renderCatManageList() {
      const cats = getCategories();
      const container = document.getElementById("catManageListContainer");
      container.innerHTML = "";
      cats.forEach((c, idx) => {
        const div = document.createElement("div");
        div.style.cssText = "display:flex; justify-content:space-between; align-items:center; background:#F8FAFC; border:1px solid #E2E8F0; padding:8px 12px; border-radius:8px;";
        div.innerHTML = `
          <span style="font-weight:700; font-size:14px;">${c}</span>
          <div style="display:flex; gap:4px;">
            <button class="batch-pill-btn" style="background:#E2E8F0; color:#334155; padding:3px 8px;" onclick="moveCategory(${idx}, -1)">⬆️</button>
            <button class="batch-pill-btn" style="background:#E2E8F0; color:#334155; padding:3px 8px;" onclick="moveCategory(${idx}, 1)">⬇️</button>
            <button class="batch-pill-btn" style="background:#FEE2E2; color:#EF4444; padding:3px 8px;" onclick="deleteCategory('${c}')">删除</button>
          </div>
        `;
        container.appendChild(div);
      });
    }

    function addNewCategory() {
      const input = document.getElementById("newCatNameInput");
      const name = input.value.trim();
      if (!name) return;
      let cats = getCategories();
      if (cats.includes(name)) return;
      cats.push(name);
      saveCategories(cats);
      input.value = "";
      renderCatManageList();
    }

    function moveCategory(idx, dir) {
      let cats = getCategories();
      const target = idx + dir;
      if (target < 0 || target >= cats.length) return;
      const temp = cats[idx];
      cats[idx] = cats[target];
      cats[target] = temp;
      saveCategories(cats);
      renderCatManageList();
    }

    function deleteCategory(name) {
      let cats = getCategories();
      if (cats.length <= 1) return;
      if (confirm(`确定删除分类【${name}】吗？`)) {
        cats = cats.filter(c => c !== name);
        saveCategories(cats);
        renderCatManageList();
      }
    }

    /* Filter Sheet Handlers */
    function openFilterSheet() {
      document.getElementById("filterExpirySelect").value = filterExpiryStatus;
      document.getElementById("filterOpenSelect").value = filterOpenStatus;
      document.getElementById("filterModal").style.display = "flex";
    }

    function closeFilterSheet() {
      document.getElementById("filterModal").style.display = "none";
    }

    function applyAdvancedFilter() {
      filterExpiryStatus = document.getElementById("filterExpirySelect").value;
      filterOpenStatus = document.getElementById("filterOpenSelect").value;
      const isFiltered = filterExpiryStatus !== "全部" || filterOpenStatus !== "全部";
      document.getElementById("btnOpenFilter").classList.toggle("active-tool", isFiltered);
      closeFilterSheet();
      renderCards();
    }

    function resetAdvancedFilter() {
      filterExpiryStatus = "全部";
      filterOpenStatus = "全部";
      document.getElementById("btnOpenFilter").classList.remove("active-tool");
      closeFilterSheet();
      renderCards();
    }

    /* Calendar Handlers */
    function prevMonth() {
      calViewDate.setMonth(calViewDate.getMonth() - 1);
      renderCalendar();
    }

    function nextMonth() {
      calViewDate.setMonth(calViewDate.getMonth() + 1);
      renderCalendar();
    }

    function renderCalendar() {
      const year = calViewDate.getFullYear();
      const month = calViewDate.getMonth();
      document.getElementById("calMonthTitle").innerText = `${year}年 ${month + 1}月`;

      const daysGrid = document.getElementById("calDaysGrid");
      if (!daysGrid) return;
      daysGrid.innerHTML = "";

      const firstDayOfMonth = new Date(year, month, 1);
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      let startDay = firstDayOfMonth.getDay() - 1;
      if (startDay === -1) startDay = 6;

      const items = getItems();
      const dateMap = {};

      items.forEach(it => {
        if (it.expiry) {
          if (!dateMap[it.expiry]) dateMap[it.expiry] = [];
          dateMap[it.expiry].push({ type: 'expiry', item: it });
        }
        if (it.openedAt) {
          if (!dateMap[it.openedAt]) dateMap[it.openedAt] = [];
          dateMap[it.openedAt].push({ type: 'opened', item: it });
        }
        if (it.createdAt) {
          const cDate = it.createdAt.slice(0, 10);
          if (!dateMap[cDate]) dateMap[cDate] = [];
          dateMap[cDate].push({ type: 'added', item: it });
        }
      });

      const prevMonthDays = new Date(year, month, 0).getDate();
      for (let i = startDay - 1; i >= 0; i--) {
        const dCell = document.createElement("div");
        dCell.className = "cal-day-cell other-month";
        dCell.innerText = prevMonthDays - i;
        daysGrid.appendChild(dCell);
      }

      const todayStr = new Date().toISOString().slice(0, 10);
      for (let day = 1; day <= daysInMonth; day++) {
        const dCell = document.createElement("div");
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;

        let cellClass = "cal-day-cell";
        if (dateStr === todayStr) cellClass += " today";
        if (dateStr === calSelectedDateStr) cellClass += " selected";
        dCell.className = cellClass;

        let dotsHtml = "";
        if (dateMap[dateStr]) {
          const events = dateMap[dateStr];
          dotsHtml = `<div class="cal-dots-row">`;
          if (events.some(e => e.type === 'expiry')) {
            const minExpiryDays = Math.min(...events.filter(e => e.type === 'expiry').map(e => calcDays(e.item.expiry)));
            if (minExpiryDays < 0) dotsHtml += `<span class="cal-dot dot-expiry-danger"></span>`;
            else if (minExpiryDays <= 30) dotsHtml += `<span class="cal-dot dot-expiry-warning"></span>`;
            else dotsHtml += `<span class="cal-dot dot-expiry-good"></span>`;
          }
          if (events.some(e => e.type === 'opened')) dotsHtml += `<span class="cal-dot dot-opened"></span>`;
          if (events.some(e => e.type === 'added')) dotsHtml += `<span class="cal-dot dot-added"></span>`;
          dotsHtml += `</div>`;
        }

        dCell.innerHTML = `<span>${day}</span>${dotsHtml}`;
        dCell.onclick = () => {
          calSelectedDateStr = dateStr;
          renderCalendar();
        };
        daysGrid.appendChild(dCell);
      }

      renderCalendarDayEvents(dateMap[calSelectedDateStr] || []);
    }

    function renderCalendarDayEvents(events) {
      const listEl = document.getElementById("calDayEventList");
      document.getElementById("calSelectedDateText").innerText = `${calSelectedDateStr} 事件清单 (${events.length}件)`;
      listEl.innerHTML = "";

      if (events.length === 0) {
        listEl.innerHTML = `<div class="empty-state" style="padding:24px 10px;"><p style="font-size:12px;">当天没有记录任何到期、开封或入库事件</p></div>`;
        return;
      }

      events.forEach(ev => {
        const it = ev.item;
        let eventTag = "";
        if (ev.type === 'expiry') eventTag = `<span class="tag-badge" style="background:#FEE2E2; color:#EF4444;">⏰ 到期</span>`;
        else if (ev.type === 'opened') eventTag = `<span class="tag-badge" style="background:#EDE9FE; color:#8B5CF6;">🧴 开封</span>`;
        else if (ev.type === 'added') eventTag = `<span class="tag-badge" style="background:#E0F2FE; color:#0284C7;">📦 入库</span>`;

        const card = document.createElement("div");
        card.className = "item-card";
        card.style.padding = "10px 12px";
        card.onclick = () => openModal(it);
        card.innerHTML = `
          <div class="card-thumb" data-thumb-id="${it.id}" style="width:48px; height:48px;"></div>
          <div class="card-content">
            <div class="card-title">${it.name}</div>
            <div class="badge-tags-row">
              ${eventTag}
              <span class="tag-badge tag-cat">${it.category}</span>
            </div>
          </div>
        `;
        listEl.appendChild(card);
      });

      hydrateThumbs(events.map(e => e.item));
    }

    /* Initialization */
    window.addEventListener("DOMContentLoaded", () => {
      renderCategoryPills();
      updateCategorySelects();
      setupFabGestures();
      updateSortButtonLabel();
      pullFromRepo();
    });

    renderCards();
  </script>
</body>
